name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MemBoard-windows
          - os: ubuntu-latest
            artifact_name: MemBoard-linux
            deb_artifact: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install librosa numpy sounddevice pygame pyinstaller==6.6.0 pillow

      - name: Build
        run: pyinstaller memboard.spec --clean --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MemBoard -DestinationPath ${{ matrix.artifact_name }}-${{ github.ref_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz -C dist MemBoard

      - name: Build deb (Linux)
        if: matrix.deb_artifact
        run: bash build_deb.sh

      - name: Rename deb for upload (Linux)
        if: matrix.deb_artifact
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          mv "memboard_${VERSION}_amd64.deb" ${{ matrix.artifact_name }}-${{ github.ref_name }}.deb

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}-${{ github.ref_name }}.*
