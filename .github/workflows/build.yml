name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MemBoard-windows.zip
          - os: ubuntu-latest
            artifact_name: MemBoard-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install librosa numpy sounddevice pygame pyinstaller==6.6.0

      - name: Build
        run: pyinstaller memboard.spec --clean --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\MemBoard\MemBoard.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "Crashed on startup with exit code $($proc.ExitCode)"
            exit 1
          }
          $proc.Kill()
          Write-Host "Smoke test passed"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          DISPLAY=:99 timeout 5 dist/MemBoard/MemBoard || EXIT=$?
          if [ "${EXIT:-0}" -eq 1 ]; then
            echo "Crashed on startup" && exit 1
          fi
          echo "Smoke test passed"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MemBoard -DestinationPath MemBoard-windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MemBoard-linux.tar.gz -C dist MemBoard

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
