name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MemBoard-windows.zip
          - os: ubuntu-latest
            artifact_name: MemBoard-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install librosa numpy sounddevice pygame pyinstaller==6.6.0

      - name: Build
        run: pyinstaller memboard.spec --clean --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MemBoard -DestinationPath MemBoard-windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MemBoard-linux.tar.gz -C dist MemBoard

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
